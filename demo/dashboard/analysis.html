<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GF Demo | التحليل المالي</title>
  <link rel="icon" type="image/png" href="gf_logo_mark_clean.png" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg:#F6F1EA;--sidebar:#FBF8F3;--card:#FFFFFF;--card-strong:#FFFFFF;--card-soft:#FBF8F3;--border:#E7DDD3;
      --text:#1C1C1C;--muted:#6F6A66;--accent:#7A2438;--accent-light:#B04A64;--accent-2:#B04A64;
      --beige:#D8CABE;--grid:#E8DED5;--positive:#587F63;--negative:#A24D4D;--shadow:0 18px 45px rgba(45,31,25,.08);
    }
    body.dark {
      color-scheme:dark;--bg:#0F1113;--sidebar:#0B0D0F;--card:#171A1F;--card-strong:#1C2027;--card-soft:#1C2027;--border:#252932;
      --text:#F5F2EE;--muted:#A7A7A7;--grid:#2A2D33;--positive:#8FBF9F;--negative:#C86B6B;--shadow:0 18px 52px rgba(0,0,0,.28);
    }
    *,*::before,*::after{box-sizing:border-box;transition:background-color .35s ease,color .35s ease,border-color .35s ease,box-shadow .35s ease,fill .35s ease,stroke .35s ease}
    html{scroll-behavior:smooth;max-width:100%;overflow-x:hidden}
    body{margin:0;min-height:100vh;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:Inter,"Avenir Next","Segoe UI","Noto Sans Arabic",system-ui,sans-serif}
    a{color:inherit;text-decoration:none}
    button{font:inherit}
    .page{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:20px 0 34px}
    .hero,.panel,.kpi,.alert,.highlight,.bridge-step{background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow)}
    .hero{margin:0 0 12px;padding:12px 18px;border-radius:18px;min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;direction:rtl}
    .hero-title{direction:rtl;text-align:right;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:3px;min-width:0}
    .hero-title h1{margin:0;font-size:clamp(17px,1.8vw,22px);line-height:1.08;letter-spacing:-.03em;font-weight:800;color:var(--text)}
    .hero-title p{margin:0;color:var(--muted);font-size:11px}
    .brand-lockup{display:flex;align-items:center;justify-content:flex-start;gap:0;direction:ltr;flex:0 0 auto}.brand-logo{width:min(96px,12vw);max-width:96px;height:auto;display:block}.brand-divider{width:1px;height:38px;background:var(--border);margin:0 8px 0 -2px}.brand-identity{display:grid;gap:2px;justify-items:start}.brand-identity strong{color:var(--text);font-size:14px;line-height:1.1;letter-spacing:.02em}.brand-identity span{color:var(--muted);font-size:11px;line-height:1.2}
    .subhero{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px}.hero-tools,.subhero-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.subhero-tools{justify-content:flex-end}
    .primary-button,.theme-toggle,.logout-button,.badge{min-height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;background:var(--sidebar);color:var(--text);font-size:12px;font-weight:700;cursor:pointer}
    .primary-button{background:var(--accent);border-color:var(--accent);color:#F5F2EE;box-shadow:0 10px 22px rgba(122,36,56,.14)}.primary-button:hover{background:var(--accent-light)}.logout-button,.badge{color:var(--muted)}.badge{cursor:default}
    .summary{margin:14px 0;padding:20px;border-radius:10px;display:grid;grid-template-columns:150px 1fr auto;gap:20px;align-items:center}
    .score{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) 0 71%,var(--border) 71%);position:relative;margin:auto}
    .score:after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--card)}
    .score div{position:relative;z-index:1;text-align:center}.score strong{font-size:28px;display:block}.score span{font-size:10px;color:var(--muted)}
    .summary-copy .eyebrow,.eyebrow{margin:0 0 5px;color:var(--accent-2);font-size:11px;font-weight:850;letter-spacing:.03em}.summary-copy h2{margin:0 0 7px;font-size:24px}.summary-copy p{margin:0;color:var(--muted);font-size:13px;line-height:1.8}
    .summary-meta{display:grid;gap:8px}.summary-chip{min-width:150px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--card-soft)}.summary-chip span{display:block;font-size:10px;color:var(--muted)}.summary-chip strong{font-size:14px}
    .kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.kpi{position:relative;overflow:hidden;border-radius:10px;padding:14px 16px;min-height:122px}.kpi::after{content:"";position:absolute;top:0;left:14px;right:14px;height:2px;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-light),var(--beige));opacity:.55}.kpi-label{color:var(--muted);font-size:13px}.kpi-value{font-size:22px;margin:10px 0 8px;display:block;font-variant-numeric:tabular-nums}.compare{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px}.delta{font-weight:850}.delta.bad{color:var(--negative)}.delta.good{color:var(--positive)}.delta.neutral{color:var(--muted)}
    .section-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:12px}.section-head h2{margin:0;font-size:17px}.section-head p{margin:4px 0 0;color:var(--muted);font-size:11px}
    .panel{border-radius:10px;padding:16px;margin-bottom:14px;overflow:hidden}.attention-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.alert{border-radius:10px;padding:13px;box-shadow:none;border-right:3px solid var(--accent-light)}.alert.medium{border-right-color:var(--beige)}.alert span{font-size:10px;color:var(--muted)}.alert strong{display:block;font-size:13px;margin:6px 0}.alert p{margin:0;color:var(--muted);font-size:11px;line-height:1.6}
    .chart-grid{display:grid;grid-template-columns:1.45fr 1fr;gap:14px}.chart-box{height:300px;position:relative}.chart-box canvas{width:100%!important;height:100%!important}
    .bridge{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;align-items:stretch}.bridge-step{box-shadow:none;border-radius:10px;padding:12px;min-height:92px}.bridge-step span{display:block;color:var(--muted);font-size:10px}.bridge-step strong{display:block;margin-top:10px;font-size:17px}.bridge-step.down{border-color:rgba(176,74,100,.45)}
    .highlight-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.highlight{box-shadow:none;border-radius:10px;padding:13px}.highlight span{display:block;color:var(--muted);font-size:10px}.highlight strong{display:block;margin:7px 0;font-size:15px}.highlight p{margin:0;color:var(--muted);font-size:11px}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:620px}th,td{padding:10px 11px;text-align:right;border-bottom:1px solid var(--grid);font-size:11px;white-space:nowrap}th{color:var(--muted);background:var(--sidebar);font-weight:800}tbody tr:last-child td{border-bottom:0}.over td{background:rgba(176,74,100,.07)}.status{display:inline-flex;padding:4px 8px;border-radius:999px;background:rgba(122,36,56,.12);color:var(--accent-light);font-size:10px;font-weight:800}.status.ok{background:rgba(216,202,190,.18);color:var(--muted)}
    .actions{display:grid;gap:8px}.action{display:grid;grid-template-columns:86px 1.2fr 1fr;gap:12px;align-items:center;padding:11px;border:1px solid var(--border);border-radius:10px}.action .priority{font-size:10px;font-weight:850;color:var(--accent-2)}.action strong{font-size:12px}.action span:last-child{font-size:11px;color:var(--muted)}
    .analysis-nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:0 0 14px;padding:6px;background:var(--sidebar);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
    .nav-button{min-height:46px;padding:8px 10px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:11px;font-weight:800;cursor:pointer}.nav-button:hover{color:var(--text);background:var(--card-soft)}.nav-button.active{background:var(--accent);color:#F5F2EE;box-shadow:0 8px 18px rgba(122,36,56,.17)}
    .view{display:none;animation:view-in .3s ease}.view.active{display:block}@keyframes view-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
    .overview-intro{margin-bottom:14px}.overview-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
    .executive-summary{display:grid;grid-template-columns:1fr 245px;gap:20px;align-items:center;padding:22px}.executive-summary h2{margin:0 0 8px;font-size:clamp(22px,2.4vw,30px);line-height:1.3}.executive-summary p{margin:0;color:var(--muted);font-size:12px;line-height:1.8}.priority-list{display:grid;gap:7px}.priority-item{display:grid;grid-template-columns:28px 1fr;gap:9px;align-items:center;padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:var(--card-soft)}.priority-item b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px}.priority-item span{font-size:11px;font-weight:800}
    .metric-story{display:grid;grid-template-columns:1.35fr 1fr;gap:12px;margin-bottom:14px}.metric-focus,.metric-driver{background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow)}.metric-focus{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;padding:20px 22px;border-radius:10px;border-top:3px solid var(--accent)}.metric-focus .metric-title,.metric-driver .metric-title{display:block;color:var(--muted);font-size:11px}.metric-focus strong{display:block;margin:8px 0 6px;font-size:clamp(25px,3vw,34px);font-variant-numeric:tabular-nums}.metric-focus p{margin:0;color:var(--muted);font-size:11px}.metric-quality{min-width:135px;padding:13px;border-right:1px solid var(--border)}.metric-quality span{display:block;color:var(--muted);font-size:10px}.metric-quality strong{font-size:22px;margin:6px 0}.metric-quality small{color:var(--negative);font-size:10px;font-weight:850}.metric-drivers{display:grid;grid-template-columns:1fr;gap:7px}.metric-driver{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 13px;border-radius:9px;box-shadow:none}.metric-driver strong{display:block;margin-top:4px;font-size:16px}.metric-driver .driver-status{text-align:left;font-size:10px;font-weight:850}.metric-driver.good .driver-status{color:var(--positive)}.metric-driver.bad .driver-status{color:var(--negative)}
    .decision-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.decision-card{padding:15px;border:1px solid var(--border);border-radius:10px;background:var(--card-soft)}.decision-card .decision-number{display:grid;place-items:center;width:28px;height:28px;margin-bottom:12px;border-radius:50%;background:rgba(122,36,56,.1);color:var(--accent);font-size:11px;font-weight:900}.decision-card h3{margin:0 0 7px;font-size:14px}.decision-card p{margin:0;color:var(--muted);font-size:11px;line-height:1.7}.decision-card .decision-action{display:block;margin-top:10px;padding-top:9px;border-top:1px solid var(--border);color:var(--text);font-weight:800}.decision-card .decision-action::before{content:"الإجراء: ";color:var(--accent-2)}
    .scope-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.scope-card{padding:15px;border:1px solid var(--border);border-radius:10px;background:var(--card);text-align:right;cursor:pointer;color:var(--text)}.scope-card:hover{border-color:var(--accent-light);transform:translateY(-2px);box-shadow:0 12px 26px rgba(45,31,25,.08)}.scope-card span{display:block;color:var(--accent-2);font-size:10px;font-weight:850}.scope-card strong{display:block;margin:7px 0;font-size:14px}.scope-card p{margin:0;color:var(--muted);font-size:10px;line-height:1.6}.scope-card b{display:block;margin-top:10px;font-size:11px;color:var(--accent)}
    .view-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 14px;padding:16px 18px;border:1px solid var(--border);border-radius:10px;background:var(--card)}.view-heading h2{margin:0 0 4px;font-size:19px}.view-heading p{margin:0;color:var(--muted);font-size:11px}.back-button{min-height:36px;padding:0 12px;border:1px solid var(--border);border-radius:9px;background:var(--sidebar);color:var(--text);font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}
    .insight-strip{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;margin-bottom:14px;padding:14px 16px;border:1px solid rgba(122,36,56,.24);border-radius:10px;background:linear-gradient(90deg,rgba(122,36,56,.07),var(--card))}.insight-strip .insight-label{color:var(--accent-2);font-size:10px;font-weight:900}.insight-strip strong{font-size:13px}.insight-strip span:last-child{color:var(--muted);font-size:11px}
    .loading,.error{padding:30px;text-align:center;color:var(--muted)}.footer{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;padding:4px 2px}
    @media(max-width:1050px){.kpi-grid,.overview-kpis{grid-template-columns:repeat(2,1fr)}.attention-grid{grid-template-columns:repeat(2,1fr)}.chart-grid,.two-col{grid-template-columns:1fr}.summary{grid-template-columns:130px 1fr}.summary-meta{grid-column:1/-1;grid-template-columns:repeat(2,1fr)}.subhero{flex-direction:column;align-items:stretch}.hero-tools,.subhero-tools{width:100%}.subhero-tools{justify-content:flex-start}.theme-toggle,.logout-button{flex:1 1 auto}.scope-grid{grid-template-columns:repeat(2,1fr)}.analysis-nav{grid-template-columns:repeat(3,1fr)}.decision-grid{grid-template-columns:1fr}.executive-summary{grid-template-columns:1fr}.metric-story{grid-template-columns:1fr}}
    @media(max-width:650px){.page{width:calc(100% - 20px);padding-top:10px}.hero{flex-direction:column;align-items:stretch;padding:14px}.hero-title{align-items:flex-start;width:100%}.brand-lockup{width:100%;max-width:100%;justify-content:center}.brand-logo{width:min(82px,24vw)}.brand-divider{height:32px}.hero-tools,.subhero-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hero-tools>*:first-child{grid-column:1/-1}.primary-button,.theme-toggle,.logout-button,.badge{width:100%}.summary{grid-template-columns:1fr;text-align:center}.summary-meta{grid-template-columns:1fr}.kpi-grid,.overview-kpis,.attention-grid,.highlight-grid,.bridge,.scope-grid{grid-template-columns:1fr}.analysis-nav{grid-template-columns:repeat(2,1fr)}.nav-button:first-child{grid-column:1/-1}.action{grid-template-columns:1fr;gap:5px}.chart-box{height:245px}.footer{flex-direction:column;gap:5px}.view-heading,.insight-strip{grid-template-columns:1fr;display:grid}.back-button{width:100%}.metric-focus{grid-template-columns:1fr}.metric-quality{border-right:0;border-top:1px solid var(--border);padding:12px 0 0}}
  </style>
</head>
<body>
  <main class="page" id="page" hidden>
    <header class="hero">
      <div class="hero-title">
        <h1>التحليل المالي التجريبي</h1>
        <p>مقارنة شهرية وتشخيص أسباب تغيّر الربحية</p>
      </div>
      <div class="brand-lockup">
        <img class="brand-logo" src="gf_logo_mark_clean.png" alt="GF Demo" />
        <div class="brand-divider" aria-hidden="true"></div>
        <div class="brand-identity"><strong>GF Demo</strong><span>Restaurant &amp; Delivery Intelligence</span></div>
      </div>
    </header>
    <div class="subhero">
      <div class="hero-tools">
        <span class="badge" id="periodLabel">جاري التحميل…</span>
        <a class="primary-button" href="index.html">العودة للبيانات</a>
        <a class="primary-button" href="../GF_Demo.xlsx">فتح Excel</a>
      </div>
      <div class="subhero-tools"><button class="theme-toggle" id="themeToggle" type="button">🌙 Night Mode</button><button class="logout-button" id="logoutButton" type="button">تسجيل خروج</button></div>
    </div>

    <div id="analysisContent"><div class="loading">جارٍ تشغيل التحليل المالي التجريبي…</div></div>

    <footer class="footer"><strong>GF Demo — بيانات صناعية للعرض فقط</strong><span>لا يوجد اتصال ببيانات حقيقية أو أنظمة خارجية</span></footer>
  </main>

  <script>
    const page = document.getElementById('page');
    const content = document.getElementById('analysisContent');
    const themeToggle = document.getElementById('themeToggle');
    const logoutButton = document.getElementById('logoutButton');
    const periodLabel = document.getElementById('periodLabel');
    const esc = (value) => String(value == null ? '' : value).replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const money = (value) => Number(value).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' ريال';
    const number = (value,digits=1) => Number(value).toLocaleString('en-US',{minimumFractionDigits:digits,maximumFractionDigits:digits});

    function applyTheme(theme){const dark=theme!=='day';document.body.classList.toggle('dark',dark);localStorage.setItem('gfTheme',dark?'dark':'day');themeToggle.textContent=dark?'☀️ Day Mode':'🌙 Night Mode'}
    function metricValue(metric,value){if(metric.unit==='ريال')return money(value);if(metric.unit==='%')return number(value)+'%';return number(value,0)+' '+metric.unit}
    function deltaClass(metric){const harmfulUp=['تكلفة الطعام','الهدر','متوسط فاتورة المصروف'];const good=(metric.direction==='up'&&!harmfulUp.includes(metric.label))||(metric.direction==='down'&&harmfulUp.includes(metric.label));return good?'good':metric.direction==='flat'?'neutral':'bad'}
    function deltaText(metric){const sign=metric.change_pct>0?'+':'';return sign+number(metric.change_pct)+(metric.comparison_unit==='نقطة'?' نقطة':'%')}

    let analysisData=null;
    const charts={};
    const metricByLabel=(data,label)=>data.kpis.find(item=>item.label===label);
    const kpiCard=(metric)=>`<article class="kpi"><span class="kpi-label">${esc(metric.label)}</span><strong class="kpi-value">${metricValue(metric,metric.current)}</strong><div class="compare"><span>السابق: ${metricValue(metric,metric.previous)}</span><span class="delta ${deltaClass(metric)}">${deltaText(metric)}</span></div></article>`;
    const actionRows=(items)=>`<div class="actions">${items.map(row=>`<div class="action"><span class="priority">${esc(row.priority)}</span><strong>${esc(row.action)}</strong><span>${esc(row.impact)}</span></div>`).join('')}</div>`;

    function render(data){
      analysisData=data;
      const revenue=metricByLabel(data,'الإيرادات'), profit=metricByLabel(data,'صافي الربح'), margin=metricByLabel(data,'هامش الربح'), food=metricByLabel(data,'تكلفة الطعام');
      const orders=metricByLabel(data,'عدد الطلبات'), averageOrder=metricByLabel(data,'متوسط قيمة الطلب'), waste=metricByLabel(data,'الهدر'), averageExpense=metricByLabel(data,'متوسط فاتورة المصروف');
      const best=data.highlights.best_product, lowest=data.highlights.lowest_product, weakBranch=data.highlights.weakest_branch, bestBranch=data.highlights.best_branch;
      const topCarrier=[...data.carriers].sort((a,b)=>b.orders-a.orders)[0], expensiveCarrier=[...data.carriers].sort((a,b)=>b.fee_per_order-a.fee_per_order)[0];
      const totalCarrierFees=data.carriers.reduce((sum,row)=>sum+row.fees,0), totalCarrierOrders=data.carriers.reduce((sum,row)=>sum+row.orders,0);
      periodLabel.textContent=`${data.period.current} مقارنة بـ ${data.period.previous}`;
      content.innerHTML=`
        <nav class="analysis-nav" aria-label="أقسام التحليل">
          <button class="nav-button active" type="button" data-target-view="overview" aria-selected="true">الملخص التنفيذي</button>
          <button class="nav-button" type="button" data-target-view="revenue" aria-selected="false">الإيرادات والربح</button>
          <button class="nav-button" type="button" data-target-view="costs" aria-selected="false">التكاليف والهدر</button>
          <button class="nav-button" type="button" data-target-view="delivery" aria-selected="false">تطبيقات التوصيل</button>
          <button class="nav-button" type="button" data-target-view="operations" aria-selected="false">الفروع والأصناف</button>
        </nav>

        <div class="view active" data-view="overview">
          <section class="panel executive-summary overview-intro">
            <div><p class="eyebrow">القرار المطلوب الآن</p><h2>أوقف تسرب الربح قبل السعي إلى مبيعات إضافية</h2><p>${esc(data.summary.detail)} لذلك الأولوية هذا الشهر هي ضبط التكلفة، لا زيادة الطلبات فقط.</p></div>
            <div class="priority-list" aria-label="ترتيب الأولويات"><div class="priority-item"><b>١</b><span>ضبط تكلفة الطعام</span></div><div class="priority-item"><b>٢</b><span>خفض هدر فرع ٢</span></div><div class="priority-item"><b>٣</b><span>مراجعة رسوم التوصيل</span></div></div>
          </section>
          <section class="metric-story" aria-label="قصة المؤشرات الرئيسية">
            <article class="metric-focus"><div><span class="metric-title">النتيجة الرئيسية · صافي الربح</span><strong>${money(profit.current)}</strong><p>انخفض <span class="delta bad">${number(Math.abs(profit.change_pct))}%</span> عن ${data.period.previous} رغم نمو الإيرادات</p></div><div class="metric-quality"><span>جودة الربح · الهامش</span><strong>${number(margin.current)}%</strong><small>${deltaText(margin)} عن السابق</small></div></article>
            <div class="metric-drivers" aria-label="مسببات تغير الربح">
              <article class="metric-driver good"><div><span class="metric-title">الإيرادات</span><strong>${money(revenue.current)}</strong></div><span class="driver-status">${deltaText(revenue)} نمو</span></article>
              <article class="metric-driver bad"><div><span class="metric-title">تكلفة الطعام</span><strong>${number(food.current)}%</strong></div><span class="driver-status">${deltaText(food)} ضغط</span></article>
              <article class="metric-driver bad"><div><span class="metric-title">الهدر</span><strong>${money(waste.current)}</strong></div><span class="driver-status">${deltaText(waste)} ارتفاع</span></article>
            </div>
          </section>
          <section class="panel"><div class="section-head"><div><p class="eyebrow">خطة العمل</p><h2>ثلاثة إجراءات مرتبة حسب الأولوية</h2><p>كل إجراء مرتبط بسبب واضح يظهر في التقرير</p></div></div><div class="decision-grid">
            <article class="decision-card"><span class="decision-number">١</span><h3>راجع الوصفات وتكلفة المكونات</h3><p>تكلفة الطعام وصلت ${number(food.current)}% مقابل ${number(food.previous)}% في الشهر السابق، وهي أكبر مصدر ضغط على الهامش.</p><span class="decision-action">ضع حدًا مستهدفًا 38% وابدأ بالأصناف الأعلى بيعًا.</span></article>
            <article class="decision-card"><span class="decision-number">٢</span><h3>نفّذ خطة خفض هدر فرع ٢</h3><p>الفرع يجمع بين أعلى هدر وأكبر تراجع شهري في الربح، لذلك يعطي أسرع فرصة لتحسين التشغيل.</p><span class="decision-action">راقب الكميات المحضّرة والمرتجعات يوميًا لمدة أسبوعين.</span></article>
            <article class="decision-card"><span class="decision-number">٣</span><h3>راجع التسعير ورسوم القنوات</h3><p>أصناف عالية الطلب تحقق هامشًا أقل من 10%، ورسوم التوصيل تضغط على الربح رغم نمو الطلبات.</p><span class="decision-action">عدّل السعر أو التكلفة ثم تفاوض على الرسم لكل طلب.</span></article>
          </div></section>
          <section class="panel"><div class="section-head"><div><p class="eyebrow">Drill down</p><h2>اختر نطاق التحليل</h2><p>كل قسم يجيب عن سؤال إداري واحد دون تشتيت</p></div></div><div class="scope-grid">
            <button class="scope-card" type="button" data-target-view="revenue"><span>هل النمو مربح؟</span><strong>الإيرادات والربح</strong><p>الاتجاه الشهري، الطلبات، متوسط الطلب، وجسر الربحية.</p><b>فتح التحليل ←</b></button>
            <button class="scope-card" type="button" data-target-view="costs"><span>أين يذهب الربح؟</span><strong>التكاليف والهدر</strong><p>المصروفات المتجاوزة وحدود المتابعة والإجراء المطلوب.</p><b>فتح التحليل ←</b></button>
            <button class="scope-card" type="button" data-target-view="delivery"><span>أي قناة تستحق التركيز؟</span><strong>تطبيقات التوصيل</strong><p>الطلبات والرسوم ومتوسط التكلفة لكل طلب.</p><b>فتح التحليل ←</b></button>
            <button class="scope-card" type="button" data-target-view="operations"><span>أين الخلل التشغيلي؟</span><strong>الفروع والأصناف</strong><p>أفضل وأسوأ فرع وربحية الأصناف عالية الطلب.</p><b>فتح التحليل ←</b></button>
          </div></section>
        </div>

        <div class="view" data-view="revenue" hidden>
          <div class="view-heading"><div><p class="eyebrow">تحليل نطاق محدد</p><h2>الإيرادات والربحية</h2><p>هل تحولت زيادة الطلب والمبيعات إلى ربح فعلي؟</p></div><button class="back-button" type="button" data-target-view="overview">العودة للملخص</button></div>
          <div class="insight-strip"><span class="insight-label">INSIGHT</span><strong>الإيراد ارتفع، لكن كل ريال مبيعات يحقق هامشًا أقل من الشهر السابق.</strong><span>الإجراء: لا توسّع الإنفاق قبل معالجة تسرب الربح.</span></div>
          <section class="kpi-grid">${[revenue,profit,orders,averageOrder].map(kpiCard).join('')}</section>
          <section class="chart-grid">
            <article class="panel"><div class="section-head"><div><p class="eyebrow">الاتجاه</p><h2>الإيرادات وصافي الربح خلال 6 أشهر</h2><p>افصل بين نمو المبيعات وجودة الربح</p></div></div><div class="chart-box"><canvas id="trendChart"></canvas></div></article>
            <article class="panel"><div class="section-head"><div><p class="eyebrow">تشخيص الانخفاض</p><h2>جسر الربحية</h2><p>التكاليف الإضافية امتصت مكاسب الإيرادات</p></div></div><div class="bridge"><div class="bridge-step"><span>ربح الشهر السابق</span><strong>${money(data.profit_bridge.previous_profit)}</strong></div><div class="bridge-step"><span>نمو الإيرادات</span><strong>+${money(data.profit_bridge.revenue_gain)}</strong></div><div class="bridge-step down"><span>تكاليف إضافية</span><strong>-${money(data.profit_bridge.added_cost)}</strong></div><div class="bridge-step down"><span>الربح الحالي</span><strong>${money(data.profit_bridge.current_profit)}</strong></div></div></article>
          </section>
        </div>

        <div class="view" data-view="costs" hidden>
          <div class="view-heading"><div><p class="eyebrow">تحليل نطاق محدد</p><h2>التكاليف والهدر</h2><p>أي مصروف تجاوز الحد وما الإجراء الذي يقلل الانحراف؟</p></div><button class="back-button" type="button" data-target-view="overview">العودة للملخص</button></div>
          <div class="insight-strip"><span class="insight-label">INSIGHT</span><strong>مواد غذائية، توصيل، وهدر تجاوزت حدود المتابعة.</strong><span>الإجراء: عالج تكلفة الطعام أولًا لأنها الأعلى أثرًا.</span></div>
          <section class="kpi-grid">${[food,waste,margin,averageExpense].map(kpiCard).join('')}</section>
          <section class="panel"><div class="section-head"><div><p class="eyebrow">الانحراف عن الحد</p><h2>أين تذهب المصروفات؟</h2><p>الصفوف المظللة تتطلب مراجعة</p></div></div><div class="chart-grid"><div class="chart-box"><canvas id="costChart"></canvas></div><div class="table-wrap"><table><thead><tr><th>المصروف</th><th>الحالي</th><th>التغير</th><th>الحد</th><th>القرار</th></tr></thead><tbody>${data.cost_variance.map(row=>`<tr class="${row.over_budget?'over':''}"><td>${esc(row.category)}</td><td>${money(row.current)}</td><td>${row.change_pct>0?'+':''}${number(row.change_pct)}%</td><td>${money(row.budget_value)}</td><td><span class="status ${row.over_budget?'':'ok'}">${row.over_budget?'مراجعة':'ضمن الحد'}</span></td></tr>`).join('')}</tbody></table></div></div></section>
          <section class="panel"><div class="section-head"><div><p class="eyebrow">الإجراء المقترح</p><h2>خطوتان للأثر الأسرع</h2></div></div>${actionRows(data.actions.slice(0,2))}</section>
        </div>

        <div class="view" data-view="delivery" hidden>
          <div class="view-heading"><div><p class="eyebrow">تحليل نطاق محدد</p><h2>تطبيقات التوصيل</h2><p>أين تأتي الطلبات، وكم تكلف كل قناة؟</p></div><button class="back-button" type="button" data-target-view="overview">العودة للملخص</button></div>
          <div class="insight-strip"><span class="insight-label">INSIGHT</span><strong>${esc(topCarrier.name)} يقود الطلبات بـ ${topCarrier.orders} طلبًا، بينما ${esc(expensiveCarrier.name)} هو الأعلى تكلفة لكل طلب.</strong><span>الإجراء: فاوض على القناة الأعلى رسمًا واحمِ القناة الأعلى طلبًا.</span></div>
          <section class="highlight-grid"><article class="highlight"><span>إجمالي طلبات التطبيقات</span><strong>${totalCarrierOrders} طلبًا</strong><p>موزعة على 4 قنوات تجريبية</p></article><article class="highlight"><span>إجمالي الرسوم</span><strong>${money(totalCarrierFees)}</strong><p>متوسط ${money(totalCarrierFees/totalCarrierOrders)} لكل طلب</p></article><article class="highlight"><span>أعلى قناة طلبًا</span><strong>${esc(topCarrier.name)}</strong><p>${topCarrier.orders} طلبًا · نمو ${number(topCarrier.orders_change_pct)}%</p></article></section>
          <section class="panel"><div class="section-head"><div><p class="eyebrow">كفاءة القنوات</p><h2>الطلبات مقابل رسوم التوصيل</h2><p>رتّب قرار التفاوض حسب الرسم لكل طلب، لا حسب إجمالي الرسوم فقط</p></div></div><div class="table-wrap"><table><thead><tr><th>الشركة</th><th>الطلبات</th><th>نمو الطلبات</th><th>إجمالي الرسوم</th><th>الرسم/طلب</th><th>تغير الرسم</th></tr></thead><tbody>${data.carriers.map(row=>`<tr class="${row.name===expensiveCarrier.name?'over':''}"><td>${esc(row.name)}</td><td>${row.orders}</td><td>${row.orders_change_pct>0?'+':''}${number(row.orders_change_pct)}%</td><td>${money(row.fees)}</td><td>${money(row.fee_per_order)}</td><td>${row.fee_per_order_change_pct>0?'+':''}${number(row.fee_per_order_change_pct)}%</td></tr>`).join('')}</tbody></table></div></section>
          <section class="panel"><div class="section-head"><div><p class="eyebrow">الإجراء المقترح</p><h2>قرار القنوات</h2></div></div>${actionRows([data.actions[3]])}</section>
        </div>

        <div class="view" data-view="operations" hidden>
          <div class="view-heading"><div><p class="eyebrow">تحليل نطاق محدد</p><h2>الفروع والأصناف</h2><p>أين يوجد الهدر، وأي مبيعات لا تحقق ربحًا كافيًا؟</p></div><button class="back-button" type="button" data-target-view="overview">العودة للملخص</button></div>
          <div class="insight-strip"><span class="insight-label">INSIGHT</span><strong>${esc(weakBranch.name)} يحتاج تدخلًا، والأصناف عالية الطلب منخفضة الهامش تستنزف فرصة الربح.</strong><span>الإجراء: خفّض هدر الفرع وعدّل تسعير أو تكلفة الأصناف المحددة.</span></div>
          <section class="highlight-grid"><article class="highlight"><span>أفضل فرع ربحًا</span><strong>${esc(bestBranch.name)}</strong><p>${money(bestBranch.current_profit)} · هامش ${bestBranch.current_margin}%</p></article><article class="highlight"><span>الفرع الأكثر احتياجًا</span><strong>${esc(weakBranch.name)}</strong><p>تغير الربح ${number(weakBranch.profit_change_pct)}% · هدر ${weakBranch.waste_pct}%</p></article><article class="highlight"><span>أعلى صنف ربحية</span><strong>${esc(best.name)}</strong><p>${money(best.profit)} · هامش ${best.margin_pct}%</p></article></section>
          <section class="two-col"><article class="panel"><div class="section-head"><div><p class="eyebrow">ربحية الأصناف</p><h2>البيع مقابل الربح</h2><p>المظلل: طلب مرتفع وهامش أقل من 10%</p></div></div><div class="table-wrap"><table><thead><tr><th>الصنف</th><th>الطلبات</th><th>الربح</th><th>الهامش</th><th>التغير</th></tr></thead><tbody>${data.products.map(row=>`<tr class="${row.margin_pct<10?'over':''}"><td>${esc(row.name)}</td><td>${row.orders}</td><td>${money(row.profit)}</td><td>${row.margin_pct}%</td><td>${row.profit_change_pct>0?'+':''}${number(row.profit_change_pct)}%</td></tr>`).join('')}</tbody></table></div></article><article class="panel"><div class="section-head"><div><p class="eyebrow">أداء الفروع</p><h2>الربح والهامش والهدر</h2><p>المظلل: تراجع يتطلب تدخلًا</p></div></div><div class="table-wrap"><table><thead><tr><th>الفرع</th><th>الربح</th><th>التغير</th><th>الهامش</th><th>الهدر</th></tr></thead><tbody>${data.branches.map(row=>`<tr class="${row.profit_change_pct<-10?'over':''}"><td>${esc(row.name)}</td><td>${money(row.current_profit)}</td><td>${row.profit_change_pct>0?'+':''}${number(row.profit_change_pct)}%</td><td>${row.current_margin}%</td><td>${row.waste_pct}%</td></tr>`).join('')}</tbody></table></div></article></section>
          <section class="panel"><div class="section-head"><div><p class="eyebrow">الإجراء المقترح</p><h2>قرارات التشغيل</h2></div></div>${actionRows(data.actions.slice(1,3))}</section>
        </div>`;
      const requested=location.hash.replace('#','');
      activateView(['overview','revenue','costs','delivery','operations'].includes(requested)?requested:'overview',false);
    }

    function activateView(name,updateHash=true){
      document.querySelectorAll('[data-view]').forEach(view=>{const active=view.dataset.view===name;view.classList.toggle('active',active);view.hidden=!active});
      document.querySelectorAll('.nav-button').forEach(button=>{const active=button.dataset.targetView===name;button.classList.toggle('active',active);button.setAttribute('aria-selected',String(active))});
      if(updateHash)history.replaceState(null,'',`#${name}`);
      if(name==='revenue')drawChart('trend',analysisData);
      if(name==='costs')drawChart('cost',analysisData);
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function drawChart(kind,data){
      if(!window.Chart||!data||charts[kind])return;
      const text=getComputedStyle(document.body).getPropertyValue('--muted').trim();
      const grid=getComputedStyle(document.body).getPropertyValue('--border').trim();
      Chart.defaults.color=text;Chart.defaults.font.family='Inter, Segoe UI, Noto Sans Arabic, system-ui';
      if(kind==='trend')charts.trend=new Chart(document.getElementById('trendChart'),{type:'line',data:{labels:data.trend.map(r=>r.month),datasets:[{label:'الإيرادات',data:data.trend.map(r=>r.revenue),borderColor:'#7A2438',backgroundColor:'rgba(122,36,56,.12)',fill:true,tension:.34},{label:'صافي الربح',data:data.trend.map(r=>r.net_profit),borderColor:'#D8CABE',backgroundColor:'transparent',tension:.34}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top'}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,grid:{color:grid},ticks:{callback:v=>Number(v).toLocaleString('en-US')}}}}});
      if(kind==='cost')charts.cost=new Chart(document.getElementById('costChart'),{type:'bar',data:{labels:data.cost_variance.map(r=>r.category),datasets:[{label:data.period.previous,data:data.cost_variance.map(r=>r.previous),backgroundColor:'#D8CABE',borderRadius:5},{label:data.period.current,data:data.cost_variance.map(r=>r.current),backgroundColor:'#7A2438',borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top'}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,grid:{color:grid},ticks:{callback:v=>Number(v).toLocaleString('en-US')}}}}});
    }

    content.addEventListener('click',(event)=>{const trigger=event.target.closest('[data-target-view]');if(trigger)activateView(trigger.dataset.targetView)});

    async function start(){
      applyTheme(localStorage.getItem('gfTheme')||'dark');
      const sessionResponse=await fetch('/api/session',{credentials:'same-origin'}).catch(()=>null);
      const session=sessionResponse&&sessionResponse.ok?await sessionResponse.json():{authenticated:false};
      if(!session.authenticated){location.replace('index.html');return}
      page.hidden=false;
      try{const response=await fetch('/api/financial-analysis',{credentials:'same-origin'});if(!response.ok)throw new Error('unavailable');const result=await response.json();render(result.analysis)}catch(error){content.innerHTML='<div class="panel error">تعذّر تحميل التحليل التجريبي حاليًا.</div>'}
    }
    themeToggle.addEventListener('click',()=>{applyTheme(document.body.classList.contains('dark')?'day':'dark');location.reload()});
    logoutButton.addEventListener('click',async()=>{await fetch('/api/logout',{method:'POST',credentials:'same-origin'}).catch(()=>{});location.replace('index.html')});
    start();
  </script>
</body>
</html>
