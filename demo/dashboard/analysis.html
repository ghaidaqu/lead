<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GF Demo | التحليل المالي</title>
  <link rel="icon" type="image/png" href="gf_logo_mark_clean.png" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg:#F6F1EA;--card:#FFFFFF;--card-soft:#FBF8F3;--border:#E7DDD3;
      --text:#1C1C1C;--muted:#6F6A66;--accent:#7A2438;--accent-2:#B04A64;
      --beige:#D8CABE;--ink:#17253A;--warning:#A9653C;--shadow:0 18px 45px rgba(45,31,25,.08);
    }
    body.dark {
      color-scheme:dark;--bg:#0F1113;--card:#171A1F;--card-soft:#1C2027;--border:#252932;
      --text:#F5F2EE;--muted:#A7A7A7;--ink:#F5F2EE;--shadow:0 18px 52px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI","Noto Sans Arabic",system-ui,sans-serif}
    a{color:inherit;text-decoration:none}
    button{font:inherit}
    .page{width:min(1220px,calc(100% - 32px));margin:0 auto;padding:20px 0 36px}
    .hero,.panel,.kpi,.alert,.highlight,.bridge-step{background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow)}
    body.dark .hero,body.dark .panel,body.dark .kpi,body.dark .alert,body.dark .highlight,body.dark .bridge-step{background:linear-gradient(180deg,rgba(33,47,70,.95),rgba(17,29,46,.92))}
    .hero{padding:15px 18px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
    body.dark .hero{background:linear-gradient(180deg,rgba(24,36,55,.97),rgba(14,24,40,.94))}
    .hero-copy{display:flex;align-items:center;gap:12px}.hero-copy img{width:82px;height:auto}.divider{width:1px;height:42px;background:var(--border)}
    h1{font-size:22px;margin:0 0 4px}.hero p{margin:0;color:var(--muted);font-size:12px}
    .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .button,.period-pill{min-height:38px;padding:0 13px;border-radius:9px;border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;background:var(--card-soft);color:var(--text);font-size:12px;font-weight:750;cursor:pointer}
    .button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.period-pill{cursor:default;color:var(--muted)}
    .summary{margin:14px 0;padding:20px;border-radius:12px;display:grid;grid-template-columns:150px 1fr auto;gap:20px;align-items:center}
    .score{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) 0 71%,var(--border) 71%);position:relative;margin:auto}
    .score:after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--card)}body.dark .score:after{background:#172134}
    .score div{position:relative;z-index:1;text-align:center}.score strong{font-size:28px;display:block}.score span{font-size:10px;color:var(--muted)}
    .summary-copy .eyebrow,.eyebrow{margin:0 0 5px;color:var(--accent-2);font-size:11px;font-weight:850;letter-spacing:.03em}.summary-copy h2{margin:0 0 7px;font-size:24px}.summary-copy p{margin:0;color:var(--muted);font-size:13px;line-height:1.8}
    .summary-meta{display:grid;gap:8px}.summary-chip{min-width:150px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--card-soft)}.summary-chip span{display:block;font-size:10px;color:var(--muted)}.summary-chip strong{font-size:14px}
    .kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.kpi{border-radius:10px;padding:14px;min-height:122px}.kpi-label{color:var(--muted);font-size:12px}.kpi-value{font-size:21px;margin:10px 0 8px;display:block;font-variant-numeric:tabular-nums}.compare{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px}.delta{font-weight:850}.delta.bad{color:var(--accent-2)}.delta.good{color:#8E6573}.delta.neutral{color:var(--muted)}
    .section-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:12px}.section-head h2{margin:0;font-size:17px}.section-head p{margin:4px 0 0;color:var(--muted);font-size:11px}
    .panel{border-radius:11px;padding:16px;margin-bottom:14px;overflow:hidden}.attention-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.alert{border-radius:9px;padding:13px;box-shadow:none;border-right:3px solid var(--accent-2)}.alert.medium{border-right-color:#B89A7D}.alert span{font-size:10px;color:var(--muted)}.alert strong{display:block;font-size:13px;margin:6px 0}.alert p{margin:0;color:var(--muted);font-size:11px;line-height:1.6}
    .chart-grid{display:grid;grid-template-columns:1.45fr 1fr;gap:14px}.chart-box{height:300px;position:relative}.chart-box canvas{width:100%!important;height:100%!important}
    .bridge{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;align-items:stretch}.bridge-step{box-shadow:none;border-radius:9px;padding:12px;min-height:92px}.bridge-step span{display:block;color:var(--muted);font-size:10px}.bridge-step strong{display:block;margin-top:10px;font-size:17px}.bridge-step.down{border-color:rgba(176,74,100,.45)}
    .highlight-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.highlight{box-shadow:none;border-radius:9px;padding:13px}.highlight span{display:block;color:var(--muted);font-size:10px}.highlight strong{display:block;margin:7px 0;font-size:15px}.highlight p{margin:0;color:var(--muted);font-size:11px}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:9px}table{width:100%;border-collapse:collapse;min-width:620px}th,td{padding:10px 11px;text-align:right;border-bottom:1px solid var(--border);font-size:11px;white-space:nowrap}th{color:var(--muted);background:var(--card-soft);font-weight:800}tbody tr:last-child td{border-bottom:0}.over td{background:rgba(176,74,100,.07)}.status{display:inline-flex;padding:4px 8px;border-radius:999px;background:rgba(122,36,56,.12);color:var(--accent-2);font-size:10px;font-weight:800}.status.ok{background:rgba(216,202,190,.18);color:var(--muted)}
    .actions{display:grid;gap:8px}.action{display:grid;grid-template-columns:86px 1.2fr 1fr;gap:12px;align-items:center;padding:11px;border:1px solid var(--border);border-radius:9px}.action .priority{font-size:10px;font-weight:850;color:var(--accent-2)}.action strong{font-size:12px}.action span:last-child{font-size:11px;color:var(--muted)}
    .loading,.error{padding:30px;text-align:center;color:var(--muted)}.footer{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;padding:4px 2px}
    @media(max-width:1050px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.attention-grid{grid-template-columns:repeat(2,1fr)}.chart-grid,.two-col{grid-template-columns:1fr}.summary{grid-template-columns:130px 1fr}.summary-meta{grid-column:1/-1;grid-template-columns:repeat(2,1fr)}}
    @media(max-width:650px){.page{width:min(100% - 20px,1220px)}.hero{align-items:flex-start}.tools{width:100%}.button,.period-pill{flex:1}.summary{grid-template-columns:1fr;text-align:center}.summary-meta{grid-template-columns:1fr}.kpi-grid,.attention-grid,.highlight-grid,.bridge{grid-template-columns:1fr}.action{grid-template-columns:1fr;gap:5px}.chart-box{height:245px}.footer{flex-direction:column;gap:5px}}
  </style>
</head>
<body>
  <main class="page" id="page" hidden>
    <header class="hero">
      <div class="hero-copy">
        <img src="gf_logo_mark_clean.png" alt="GF Demo" />
        <div class="divider" aria-hidden="true"></div>
        <div><h1>التحليل المالي التجريبي</h1><p>مقارنة شهرية وتشخيص أسباب تغيّر الربحية</p></div>
      </div>
      <div class="tools">
        <span class="period-pill" id="periodLabel">جاري التحميل…</span>
        <a class="button" href="index.html">العودة للبيانات</a>
        <a class="button" href="../GF_Demo.xlsx">فتح Excel</a>
        <button class="button" id="themeToggle" type="button">🌙 Night Mode</button>
        <button class="button primary" id="logoutButton" type="button">تسجيل خروج</button>
      </div>
    </header>

    <div id="analysisContent"><div class="loading">جارٍ تشغيل التحليل المالي التجريبي…</div></div>

    <footer class="footer"><strong>GF Demo — بيانات صناعية للعرض فقط</strong><span>لا يوجد اتصال ببيانات حقيقية أو أنظمة خارجية</span></footer>
  </main>

  <script>
    const page = document.getElementById('page');
    const content = document.getElementById('analysisContent');
    const themeToggle = document.getElementById('themeToggle');
    const logoutButton = document.getElementById('logoutButton');
    const periodLabel = document.getElementById('periodLabel');
    const esc = (value) => String(value == null ? '' : value).replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const money = (value) => Number(value).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' ريال';
    const number = (value,digits=1) => Number(value).toLocaleString('en-US',{minimumFractionDigits:digits,maximumFractionDigits:digits});

    function applyTheme(theme){const dark=theme!=='day';document.body.classList.toggle('dark',dark);localStorage.setItem('gfTheme',dark?'dark':'day');themeToggle.textContent=dark?'☀️ Day Mode':'🌙 Night Mode'}
    function metricValue(metric,value){if(metric.unit==='ريال')return money(value);if(metric.unit==='%')return number(value)+'%';return number(value,0)+' '+metric.unit}
    function deltaClass(metric){const harmfulUp=['تكلفة الطعام','الهدر','متوسط فاتورة المصروف'];const good=(metric.direction==='up'&&!harmfulUp.includes(metric.label))||(metric.direction==='down'&&harmfulUp.includes(metric.label));return good?'good':metric.direction==='flat'?'neutral':'bad'}
    function deltaText(metric){const sign=metric.change_pct>0?'+':'';return sign+number(metric.change_pct)+(metric.comparison_unit==='نقطة'?' نقطة':'%')}

    function render(data){
      const best=data.highlights.best_product, lowest=data.highlights.lowest_product, branch=data.highlights.weakest_branch;
      periodLabel.textContent=`${data.period.current} مقارنة بـ ${data.period.previous}`;
      content.innerHTML=`
        <section class="panel summary">
          <div class="score"><div><strong>${data.summary.health_score}</strong><span>صحة الربحية / 100</span></div></div>
          <div class="summary-copy"><p class="eyebrow">الخلاصة التنفيذية</p><h2>${esc(data.summary.headline)}</h2><p>${esc(data.summary.detail)}</p></div>
          <div class="summary-meta"><div class="summary-chip"><span>التنبيهات الحالية</span><strong>${data.summary.alerts} تنبيهات</strong></div><div class="summary-chip"><span>نوع البيانات</span><strong>نموذج صناعي</strong></div></div>
        </section>

        <section class="kpi-grid">${data.kpis.map(metric=>`<article class="kpi"><span class="kpi-label">${esc(metric.label)}</span><strong class="kpi-value">${metricValue(metric,metric.current)}</strong><div class="compare"><span>السابق: ${metricValue(metric,metric.previous)}</span><span class="delta ${deltaClass(metric)}">${deltaText(metric)}</span></div></article>`).join('')}</section>

        <section class="panel"><div class="section-head"><div><p class="eyebrow">انتبه الآن</p><h2>الأشياء التي تحتاج تدخلًا هذه الفترة</h2><p>مرتبة حسب أثرها على الربح والتشغيل</p></div></div><div class="attention-grid">${data.alerts.map(item=>`<article class="alert ${item.level}"><span>${item.level==='high'?'أولوية مرتفعة':'أولوية متوسطة'}</span><strong>${esc(item.title)}</strong><p>${esc(item.detail)}</p></article>`).join('')}</div></section>

        <section class="chart-grid">
          <article class="panel"><div class="section-head"><div><p class="eyebrow">الاتجاه المالي</p><h2>الإيرادات وصافي الربح خلال 6 أشهر</h2><p>القيمة بالريال — الهامش ظاهر في جدول البيانات المصاحب</p></div></div><div class="chart-box"><canvas id="trendChart"></canvas></div></article>
          <article class="panel"><div class="section-head"><div><p class="eyebrow">جسر الربحية</p><h2>لماذا انخفض الربح؟</h2><p>الزيادة في التكاليف امتصت نمو الإيراد</p></div></div><div class="bridge"><div class="bridge-step"><span>ربح الشهر السابق</span><strong>${money(data.profit_bridge.previous_profit)}</strong></div><div class="bridge-step"><span>نمو الإيرادات</span><strong>+${money(data.profit_bridge.revenue_gain)}</strong></div><div class="bridge-step down"><span>تكاليف إضافية</span><strong>-${money(data.profit_bridge.added_cost)}</strong></div><div class="bridge-step down"><span>ربح الشهر الحالي</span><strong>${money(data.profit_bridge.current_profit)}</strong></div></div></article>
        </section>

        <section class="panel"><div class="section-head"><div><p class="eyebrow">المصروفات والانحراف</p><h2>أي نوع مصروف أعلى من اللازم؟</h2><p>مقارنة الفعلي بالشهر السابق وبحدود متابعة تجريبية مرتبطة بالإيراد</p></div></div><div class="chart-grid"><div class="chart-box"><canvas id="costChart"></canvas></div><div class="table-wrap"><table><thead><tr><th>المصروف</th><th>الحالي</th><th>السابق</th><th>التغير</th><th>الحد</th><th>الانحراف</th></tr></thead><tbody>${data.cost_variance.map(row=>`<tr class="${row.over_budget?'over':''}"><td>${esc(row.category)}</td><td>${money(row.current)}</td><td>${money(row.previous)}</td><td>${row.change_pct>0?'+':''}${number(row.change_pct)}%</td><td>${money(row.budget_value)}</td><td><span class="status ${row.over_budget?'':'ok'}">${row.over_budget?'أعلى '+money(row.budget_variance):'ضمن الحد'}</span></td></tr>`).join('')}</tbody></table></div></div></section>

        <section class="panel"><div class="section-head"><div><p class="eyebrow">قراءة سريعة</p><h2>الأعلى والأقل ربحية</h2></div></div><div class="highlight-grid"><article class="highlight"><span>أعلى صنف ربحية</span><strong>${esc(best.name)}</strong><p>${money(best.profit)} ربح · هامش ${best.margin_pct}%</p></article><article class="highlight"><span>أقل صنف ربحية</span><strong>${esc(lowest.name)}</strong><p>${money(lowest.profit)} ربح · هامش ${lowest.margin_pct}%</p></article><article class="highlight"><span>الفرع الأكثر احتياجًا للمراجعة</span><strong>${esc(branch.name)}</strong><p>تغير الربح ${number(branch.profit_change_pct)}% · هدر ${branch.waste_pct}%</p></article></div></section>

        <section class="two-col">
          <article class="panel"><div class="section-head"><div><p class="eyebrow">ربحية الأصناف</p><h2>البيع مقابل الربح</h2></div></div><div class="table-wrap"><table><thead><tr><th>الصنف</th><th>الطلبات</th><th>الربح</th><th>الهامش</th><th>التغير</th></tr></thead><tbody>${data.products.map(row=>`<tr class="${row.margin_pct<10?'over':''}"><td>${esc(row.name)}</td><td>${row.orders}</td><td>${money(row.profit)}</td><td>${row.margin_pct}%</td><td>${row.profit_change_pct>0?'+':''}${number(row.profit_change_pct)}%</td></tr>`).join('')}</tbody></table></div></article>
          <article class="panel"><div class="section-head"><div><p class="eyebrow">تحليل الفروع</p><h2>الربح والهامش والهدر</h2></div></div><div class="table-wrap"><table><thead><tr><th>الفرع</th><th>الربح الحالي</th><th>الربح السابق</th><th>التغير</th><th>الهامش</th><th>الهدر</th></tr></thead><tbody>${data.branches.map(row=>`<tr class="${row.profit_change_pct<-10?'over':''}"><td>${esc(row.name)}</td><td>${money(row.current_profit)}</td><td>${money(row.previous_profit)}</td><td>${row.profit_change_pct>0?'+':''}${number(row.profit_change_pct)}%</td><td>${row.current_margin}%</td><td>${row.waste_pct}%</td></tr>`).join('')}</tbody></table></div></article>
        </section>

        <section class="two-col">
          <article class="panel"><div class="section-head"><div><p class="eyebrow">شركات التوصيل</p><h2>الطلبات والرسوم لكل طلب</h2></div></div><div class="table-wrap"><table><thead><tr><th>الشركة</th><th>الطلبات</th><th>تغير الطلبات</th><th>الرسوم</th><th>الرسم/طلب</th><th>تغير الرسم</th></tr></thead><tbody>${data.carriers.map(row=>`<tr><td>${esc(row.name)}</td><td>${row.orders}</td><td>+${number(row.orders_change_pct)}%</td><td>${money(row.fees)}</td><td>${money(row.fee_per_order)}</td><td>${row.fee_per_order_change_pct>0?'+':''}${number(row.fee_per_order_change_pct)}%</td></tr>`).join('')}</tbody></table></div></article>
          <article class="panel"><div class="section-head"><div><p class="eyebrow">قواعد التحليل</p><h2>كيف تُطلق التنبيهات؟</h2><p>حدود تجريبية واضحة للعرض ويمكن تخصيصها لاحقًا</p></div></div><div class="table-wrap"><table><thead><tr><th>المؤشر</th><th>القاعدة</th><th>الفعلي</th><th>الحالة</th></tr></thead><tbody>${data.analysis_rules.map(row=>`<tr><td>${esc(row.metric)}</td><td>${esc(row.rule)}</td><td>${esc(row.actual)}</td><td><span class="status">${esc(row.status)}</span></td></tr>`).join('')}</tbody></table></div></article>
        </section>

        <section class="panel"><div class="section-head"><div><p class="eyebrow">التوصيات التنفيذية</p><h2>ماذا نفعل الآن؟</h2><p>إجراءات مرتبطة مباشرة بالانحرافات المكتشفة</p></div></div><div class="actions">${data.actions.map(row=>`<div class="action"><span class="priority">${esc(row.priority)}</span><strong>${esc(row.action)}</strong><span>${esc(row.impact)}</span></div>`).join('')}</div></section>`;
      drawCharts(data);
    }

    function drawCharts(data){
      if(!window.Chart)return;
      const text=getComputedStyle(document.body).getPropertyValue('--muted').trim();
      const grid=getComputedStyle(document.body).getPropertyValue('--border').trim();
      Chart.defaults.color=text;Chart.defaults.font.family='Inter, Segoe UI, Noto Sans Arabic, system-ui';
      new Chart(document.getElementById('trendChart'),{type:'line',data:{labels:data.trend.map(r=>r.month),datasets:[{label:'الإيرادات',data:data.trend.map(r=>r.revenue),borderColor:'#7A2438',backgroundColor:'rgba(122,36,56,.12)',fill:true,tension:.34,yAxisID:'y'},{label:'صافي الربح',data:data.trend.map(r=>r.net_profit),borderColor:'#D8CABE',backgroundColor:'transparent',tension:.34,yAxisID:'y'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top'}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,grid:{color:grid},ticks:{callback:v=>Number(v).toLocaleString('en-US')}}}}});
      new Chart(document.getElementById('costChart'),{type:'bar',data:{labels:data.cost_variance.map(r=>r.category),datasets:[{label:data.period.previous,data:data.cost_variance.map(r=>r.previous),backgroundColor:'#D8CABE',borderRadius:5},{label:data.period.current,data:data.cost_variance.map(r=>r.current),backgroundColor:'#7A2438',borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top'}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,grid:{color:grid},ticks:{callback:v=>Number(v).toLocaleString('en-US')}}}}});
    }

    async function start(){
      applyTheme(localStorage.getItem('gfTheme')||'dark');
      const sessionResponse=await fetch('/api/session',{credentials:'same-origin'}).catch(()=>null);
      const session=sessionResponse&&sessionResponse.ok?await sessionResponse.json():{authenticated:false};
      if(!session.authenticated){location.replace('index.html');return}
      page.hidden=false;
      try{const response=await fetch('/api/financial-analysis',{credentials:'same-origin'});if(!response.ok)throw new Error('unavailable');const result=await response.json();render(result.analysis)}catch(error){content.innerHTML='<div class="panel error">تعذّر تحميل التحليل التجريبي حاليًا.</div>'}
    }
    themeToggle.addEventListener('click',()=>{applyTheme(document.body.classList.contains('dark')?'day':'dark');location.reload()});
    logoutButton.addEventListener('click',async()=>{await fetch('/api/logout',{method:'POST',credentials:'same-origin'}).catch(()=>{});location.replace('index.html')});
    start();
  </script>
</body>
</html>
